name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.cxx }}, ${{ matrix.build }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cxx: g++-14, build: Release }
          - { os: ubuntu-24.04, cxx: clang++-18, build: Release }
          - { os: ubuntu-24.04, cxx: g++-14, build: Debug }
          - { os: macos-15, cxx: clang++, build: Release }
    steps:
      - uses: actions/checkout@v4
      - name: Install Boost (lockfree baseline)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q libboost-dev
          else HOMEBREW_NO_AUTO_UPDATE=1 brew install boost; fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DFH_NATIVE=OFF
      - name: Build
        run: cmake --build build -j4
      - name: Unit and stress tests (all five queues)
        run: ctest --test-dir build --output-on-failure -j4

  # One build per sanitizer: they cannot be combined. ThreadSanitizer runs
  # 5-15x slower, so it gets a smaller stress workload.
  sanitizers:
    name: sanitizer (${{ matrix.sanitize }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { sanitize: address, items: "300000", net_rate: "100000" }
          - { sanitize: undefined, items: "300000", net_rate: "100000" }
          - { sanitize: thread, items: "50000", net_rate: "40000" }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q libboost-dev
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++-18
          -DFH_NATIVE=OFF -DFH_SANITIZE=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build -j4
      - name: Unit and stress tests
        env:
          FH_STRESS_ITEMS: ${{ matrix.items }}
          FH_SPSC_ITEMS: "2000000"
          FH_NET_RATE: ${{ matrix.net_rate }}  # loopback publisher rate the slowed-down receiver keeps up with
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure -j2

  # The deliberate bug (docs/DESIGN.md): one release store made relaxed.
  # This job passes only if ThreadSanitizer reports the data race.
  deliberate-bug:
    name: deliberate ordering bug is caught by ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with FH_INJECT_ORDERING_BUG under ThreadSanitizer
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++-18 \
            -DFH_NATIVE=OFF -DFH_SANITIZE=thread -DFH_INJECT_ORDERING_BUG=ON -DFH_WITH_BOOST=OFF
          cmake --build build -j4 --target test_spsc_queue
      - name: Expect a ThreadSanitizer data race report
        run: |
          set +e
          TSAN_OPTIONS=halt_on_error=1 ./build/test_spsc_queue --gtest_filter='SpscQueue.MessagePayloadIntegrity' > tsan.txt 2>&1
          status=$?
          set -e
          grep -A12 "WARNING: ThreadSanitizer" tsan.txt | head -30
          if grep -q "WARNING: ThreadSanitizer: data race" tsan.txt; then
            echo "OK: the injected relaxed store was reported (exit $status)"
          else
            echo "::error::ThreadSanitizer did not report the injected bug"; exit 1
          fi

  # A gate nobody has seen fail proves nothing. FH_INJECT_HOT_ALLOC makes
  # FifoBook::add grow a std::vector with no reserve; this job passes only if
  # perfguard fails the run for allocating after warmup.
  deliberate-alloc:
    name: deliberate hot-path allocation is caught by perfguard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build with FH_INJECT_HOT_ALLOC
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFH_NATIVE=OFF -DFH_BUILD_TESTS=OFF \
            -DFH_WITH_BOOST=OFF -DFH_INJECT_HOT_ALLOC=ON
          cmake --build build -j4 --target feed_handler perfguard
      - name: Expect perfguard to fail on the allocations
        run: |
          ./build/feed_handler gen synthetic.itch --events 3000000 --seed 7 --stocks 64
          set +e
          ./build/perfguard run synthetic.itch --runs 3 --warmup 500000 --cpu 1 > perfguard.txt 2>&1
          status=$?
          set -e
          cat perfguard.txt
          if [ "$status" -eq 1 ] && grep -q "heap allocations after warmup" perfguard.txt; then
            echo "OK: the injected allocation was caught (exit $status)"
          else
            echo "::error::perfguard did not catch the injected allocation (exit $status)"; exit 1
          fi

  end-to-end:
    name: end-to-end on a synthetic feed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libboost-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFH_NATIVE=OFF -DFH_BUILD_TESTS=OFF
          cmake --build build -j4
      - name: Generate feed
        run: ./build/feed_handler gen synthetic.itch --events 3000000 --seed 7 --stocks 64
      # Fails on any heap allocation after warmup. Timings are printed for the
      # log only: shared runners are too noisy to gate on.
      - name: PerfGuard (zero allocations after warmup)
        run: ./build/perfguard run synthetic.itch --runs 3 --warmup 500000 --cpu 1
      - name: Count, golden, verify every queue
        run: |
          ./build/feed_handler count synthetic.itch --repeat 2
          ./build/feed_handler golden synthetic.itch --check-every 500000 --symbols SYM1,SYM2
          for q in $(./build/feed_handler queues); do
            for cap in 1024 1048576; do
              echo "== $q capacity $cap"
              ./build/feed_handler verify synthetic.itch --book fast --queue $q --capacity $cap --cpu-producer 0 --cpu-consumer 1 | tail -1
            done
          done
          ./build/feed_handler verify synthetic.itch --book golden
      - name: Queue stress (short)
        run: |
          ./build/queue_stress --queue all --capacity 4 --seconds 3
          ./build/queue_stress --queue all --capacity 1024 --seconds 3 --delays
      - name: Bench and charts
        run: |
          pip install pandas matplotlib
          ./build/feed_handler bench synthetic.itch --runs 3 --warmup 1 --label unpaced --out ci-results/unpaced
          ./build/feed_handler bench synthetic.itch --runs 3 --warmup 0 --rate 2000000 --label paced_2M --out ci-results/paced_2M
          python3 scripts/plot_results.py --results ci-results --out ci-charts
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-charts
          path: |
            ci-results
            ci-charts

  # Version 1.1 snapshot publisher (ZeroMQ + Protobuf). Its own job: the
  # option is off everywhere else, so the sanitizer builds never see ZeroMQ
  # (its internal threads are not built for ThreadSanitizer).
  publish:
    name: snapshot publisher (ZeroMQ + Protobuf)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler libprotobuf-dev libzmq3-dev cppzmq-dev
          pip install pyzmq protobuf
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFH_NATIVE=OFF -DFH_WITH_BOOST=OFF -DFH_ENABLE_PUBLISH=ON
          cmake --build build -j4 --target feed_handler test_snapshot_publisher
      - name: Publisher tests
        run: ./build/test_snapshot_publisher
      - name: Feed handler to Python subscriber over TCP
        run: |
          ./build/feed_handler gen synthetic.itch --events 2000000 --seed 7 --stocks 32
          python3 scripts/sub_snapshots.py SYM1 --endpoint tcp://127.0.0.1:5556 --timeout 5 > sub.txt &
          sleep 1
          ./build/feed_handler bench synthetic.itch --runs 1 --warmup 0 --rate 500000 \
            --publish tcp://127.0.0.1:5556 --publish-symbol SYM1 --out ci-publish | grep -E "^publish"
          wait
          head -3 sub.txt; tail -1 sub.txt
          grep -q "^received [1-9]" sub.txt

  # Version 2 on one Linux host (Stages C2-C4): publisher and receiver in two
  # network namespaces joined by a veth pair, lines A and B on two multicast
  # groups. Kernel sockets and AF_XDP, clean and under seeded loss. Each run
  # must match the golden model at every checkpoint, with zero heap
  # allocations after warmup.
  network:
    name: network path (netns multicast, kernel sockets and AF_XDP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libxdp-dev libbpf-dev clang llvm
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFH_NATIVE=OFF -DFH_BUILD_TESTS=OFF \
            -DFH_WITH_BOOST=OFF -DFH_ENABLE_XDP=ON
          cmake --build build -j4 --target feed_handler golden_hashes itch_publisher itch_receiver
      - name: Synthetic feed and its golden hashes
        run: |
          ./build/feed_handler gen synthetic.itch --events 3000000 --seed 7 --stocks 64
          ./build/golden_hashes synthetic.itch synthetic.golden --every 262144
      - name: Kernel sockets, clean
        run: sudo OUT=out/udp_clean RATE=1000000 bench/netns_feed.sh build synthetic.itch synthetic.golden
      - name: Kernel sockets, 1% loss per line, 0.2% on both, a 500-packet burst on both
        run: >
          sudo OUT=out/udp_loss RATE=1000000 bench/netns_feed.sh build synthetic.itch synthetic.golden
          --- --seed 5 --drop-a 0.01 --drop-b 0.01 --drop-both 0.002 --drop-range 20000-20499:ab
          --duplicate 0.01 --reorder 0.01
      - name: Kernel sockets, late join (snapshot), line A dies
        run: >
          sudo OUT=out/udp_late RATE=1000000 bench/netns_feed.sh build synthetic.itch synthetic.golden
          -- --snapshot-threshold 100000 --- --drop-range 0-2999:ab --kill-a 40000
      - name: AF_XDP (generic XDP on the veth), clean
        run: sudo OUT=out/xdp_clean TRANSPORT=xdp RATE=1000000 bench/netns_feed.sh build synthetic.itch synthetic.golden
      - name: AF_XDP under loss
        run: >
          sudo OUT=out/xdp_loss TRANSPORT=xdp RATE=1000000 bench/netns_feed.sh build synthetic.itch synthetic.golden
          --- --seed 9 --drop-a 0.01 --drop-b 0.01 --drop-both 0.002 --drop-range 30000-30199:ab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-logs
          path: out

  # DPDK is time-boxed in the plan: this job only proves the DPDK receive
  # path builds and delivers a verified book, through DPDK's af_packet device
  # on the same veth (no hugepages, no NIC). Real numbers need a NIC bound to
  # vfio-pci on bare metal (docs/AWS_BENCHMARK.md).
  dpdk:
    name: DPDK receive path (af_packet device, functional)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install DPDK
        run: sudo apt-get update -q && sudo apt-get install -y -q dpdk-dev libdpdk-dev pkg-config
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFH_NATIVE=OFF -DFH_BUILD_TESTS=OFF \
            -DFH_WITH_BOOST=OFF -DFH_ENABLE_DPDK=ON
          cmake --build build -j4 --target feed_handler golden_hashes itch_publisher itch_receiver
      - name: DPDK, clean and under loss
        run: |
          ./build/feed_handler gen synthetic.itch --events 2000000 --seed 7 --stocks 64
          ./build/golden_hashes synthetic.itch synthetic.golden --every 262144
          sudo OUT=out/dpdk_clean TRANSPORT=dpdk RATE=500000 bench/netns_feed.sh build synthetic.itch synthetic.golden
          sudo OUT=out/dpdk_loss TRANSPORT=dpdk RATE=500000 bench/netns_feed.sh build synthetic.itch synthetic.golden \
            --- --seed 4 --drop-a 0.01 --drop-b 0.01 --drop-both 0.002
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dpdk-logs
          path: out
